name: Maintainer approval
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write
jobs:
  review:
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (startsWith(github.event.comment.body, '/approve ') || startsWith(github.event.changes.body.from, '/approve ')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number ?? context.issue.number;
            const {data: pr} = await github.rest.pulls.get({...context.repo,pull_number:number});
            if (pr.state !== 'open') return;
            const comments = await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:number,per_page:100});
            const approved = comments.some(c => c.user.login === 'Bhav3shChawla' && c.body.trim() === '/approve ' + pr.head.sha);
            await github.rest.repos.createCommitStatus({...context.repo,sha:pr.head.sha,context:'maintainer-approval',state:approved?'success':'pending',description:approved?'Maintainer approved this exact commit':'Awaiting owner /approve HEAD_SHA comment',target_url:pr.html_url});
