name: Registry validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node ../trusted/scripts/validate-registry.mjs
        working-directory: candidate
      - run: node --test scripts/validate-record.test.mjs
        working-directory: trusted
