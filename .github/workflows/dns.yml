name: Publish approved DNS
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dns-publication
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.head.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: head
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: node scripts/validate-registry.mjs
      - run: node scripts/dns-sync.mjs plan dns-plan.json
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_READ_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: dns-plan
          path: dns-plan.json
  apply:
    needs: plan
    environment: dns-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dns-plan
      - run: |
          DIGEST=$(node -e "const fs=require('fs'),crypto=require('crypto');process.stdout.write(crypto.createHash('sha256').update(JSON.stringify(JSON.parse(fs.readFileSync('dns-plan.json','utf8')))).digest('hex'))")
          node scripts/dns-sync.mjs apply dns-plan.json "$DIGEST"
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dns-backup
          path: dns-backups/
          if-no-files-found: ignore
